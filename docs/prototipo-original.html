<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino de Guitarra — Painel Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B1613;
    --panel: #241E19;
    --panel-2: #2E2620;
    --panel-3: #362D25;
    --border: #4A3F33;
    --border-soft: #362E27;
    --text: #EDE6D6;
    --text-dim: #B7AA95;
    --text-faint: #7D7263;
    --brass: #C9A227;
    --brass-dim: #8C7420;
    --led-green: #7FA65B;
    --led-green-glow: rgba(127,166,91,0.35);
    --led-red: #C1443C;
    --lcd-bg: #14100D;
    --lcd-text: #E8B84B;
    --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(201,162,39,0.06), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }

  /* ---- Header / faceplate ---- */
  header.faceplate {
    background: linear-gradient(180deg, var(--panel-3), var(--panel));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  header.faceplate::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 40%);
    pointer-events: none;
  }
  .faceplate-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--text);
    line-height: 1.15;
  }
  .brand small {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-faint);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .streak-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--lcd-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 12px;
    flex-shrink: 0;
  }
  .streak-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--led-green);
    box-shadow: 0 0 7px var(--led-green-glow);
  }
  .streak-dot.off { background: #55483A; box-shadow: none; }
  .streak-num {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 15px;
    color: var(--lcd-text);
  }
  .streak-label {
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.4px;
  }

  /* ---- Day tabs ---- */
  .day-tabs {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .day-tab {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 7px;
    padding: 9px 2px 7px;
    text-align: center;
    cursor: pointer;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
    position: relative;
  }
  .day-tab .dot {
    display: block;
    width: 5px; height: 5px; border-radius: 50%;
    background: transparent;
    margin: 4px auto 0;
  }
  .day-tab .dot.done { background: var(--led-green); }
  .day-tab.today { color: var(--brass); border-color: var(--brass-dim); }
  .day-tab.active {
    background: var(--panel-3);
    color: var(--text);
    border-color: var(--brass);
  }

  /* ---- Day header ---- */
  .day-header {
    padding: 4px 2px 14px;
  }
  .day-header .kicker {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .day-header h1 {
    font-size: 21px;
    margin: 0 0 6px;
    font-weight: 700;
    color: var(--text);
  }
  .day-header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.5;
  }
  .tag-detail {
    display: inline-block;
    margin-top: 9px;
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--text-faint);
  }
  .tag-detail.full { color: var(--brass); border-color: var(--brass-dim); }

  /* ---- Progress meter (VU style) ---- */
  .vu-meter {
    display: flex; gap: 3px;
    margin: 12px 0 18px;
  }
  .vu-seg {
    flex: 1;
    height: 7px;
    border-radius: 2px;
    background: var(--panel-2);
    border: 1px solid var(--border-soft);
  }
  .vu-seg.on { background: var(--led-green); border-color: var(--led-green); box-shadow: 0 0 6px var(--led-green-glow); }

  /* ---- Blocks ---- */
  .block {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .block-head {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px;
    cursor: pointer;
  }
  .switch {
    width: 34px; height: 20px;
    background: var(--lcd-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    position: relative;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: left .15s ease, background .15s ease;
  }
  .switch.on { border-color: var(--led-green); }
  .switch.on .knob { left: 16px; background: var(--led-green); box-shadow: 0 0 6px var(--led-green-glow); }

  .block-head .meta { flex: 1; min-width: 0; }
  .block-head .meta .title {
    font-size: 14.5px; font-weight: 600; color: var(--text);
  }
  .block-head .meta .title.done { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border); }
  .block-head .meta .duration {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-faint); margin-top: 1px;
  }
  .chevron {
    color: var(--text-faint);
    font-size: 12px;
    transition: transform .15s ease;
    flex-shrink: 0;
  }
  .chevron.open { transform: rotate(90deg); }

  .block-body {
    display: none;
    padding: 0 14px 16px;
    border-top: 1px solid var(--border-soft);
  }
  .block-body.open { display: block; padding-top: 12px; }
  .block-body p {
    margin: 0 0 10px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-dim);
  }
  .block-body p:last-child { margin-bottom: 0; }
  .block-body strong { color: var(--text); font-weight: 600; }

  .tab-readout {
    background: var(--lcd-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 12px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .tab-readout pre {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.55;
    color: var(--lcd-text);
    white-space: pre;
  }

  .chord-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    margin: 10px 0;
  }
  .chord-card {
    background: var(--lcd-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px;
  }
  .chord-card .name {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--brass);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .chord-card pre {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--lcd-text);
    line-height: 1.5;
  }

  /* ---- BPM tracker ---- */
  .bpm-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
  }
  .bpm-box .label-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .bpm-box .label-row span { font-size: 12px; color: var(--text-faint); font-family: var(--font-mono); letter-spacing: 0.3px; }
  .bpm-readout {
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .bpm-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--panel-3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    font-family: var(--font-mono);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    flex-shrink: 0;
  }
  .bpm-btn:active { background: var(--brass-dim); }
  .bpm-lcd {
    background: var(--lcd-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 18px;
    min-width: 92px;
    text-align: center;
  }
  .bpm-lcd .num {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 600;
    color: var(--lcd-text);
    line-height: 1;
  }
  .bpm-lcd .unit {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }
  .bpm-history {
    display: flex; gap: 4px; align-items: flex-end;
    margin-top: 12px; height: 34px;
  }
  .bpm-history .bar {
    flex: 1;
    background: var(--brass-dim);
    border-radius: 2px 2px 0 0;
    min-height: 3px;
  }
  .bpm-history-empty {
    font-size: 11.5px; color: var(--text-faint); margin-top: 10px; font-style: normal;
  }

  textarea.notes {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13.5px;
    padding: 10px;
    resize: vertical;
    min-height: 60px;
    margin-top: 4px;
  }
  textarea.notes::placeholder { color: var(--text-faint); }
  .notes-label {
    font-size: 12px; color: var(--text-faint); font-family: var(--font-mono);
    letter-spacing: 0.3px; margin-bottom: 6px; display: block;
  }
  .notes-block {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    padding: 13px 14px 14px;
    margin-top: 4px;
  }

  footer.hint {
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    margin-top: 18px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="app">

  <header class="faceplate">
    <div class="faceplate-top">
      <div class="brand">Painel de Treino
        <small>Guitarra · rotina diária · rock &amp; técnica</small>
      </div>
      <div class="streak-pill">
        <div class="streak-dot" id="streakDot"></div>
        <div>
          <div class="streak-num" id="streakNum">0</div>
          <div class="streak-label">dias seguidos</div>
        </div>
      </div>
    </div>
  </header>

  <nav class="day-tabs" id="dayTabs"></nav>

  <main id="dayContent"></main>

  <footer class="hint">Os dados ficam salvos só neste navegador. Peça no chat para detalhar qualquer dia da semana.</footer>
</div>

<script>
(function () {
  "use strict";

  var DAYS = [
    { key: "seg", label: "SEG", weekday: 1, full: true, title: "Alternate Picking", focus: "Técnica: alternate picking em pentatônica de Lá menor.",
      blocks: [
        { id: "aq", title: "Aquecimento", dur: "10 min",
          body: "<p>Exercício cromático <strong>1-2-3-4</strong> na corda Mi grave, subindo trastes consecutivos, depois passando pra próxima corda. Metrônomo em <strong>60–70 BPM</strong>, uma nota por clique.</p><p>Foco: cada nota limpa, sem zumbido, volume parelho entre os dedos — preste atenção no mindinho, ele costuma sair mais fraco.</p>" },
        { id: "tec", title: "Alternate Picking — Pentatônica", dur: "20 min", bpm: true,
          body: "<p>Caixa 1 da pentatônica de <strong>Lá menor</strong>, palhetada alternada rígida (baixo-cima-baixo-cima), mesmo trocando de corda:</p>" +
            "<div class='tab-readout'><pre>E|--------------------5--8--\nB|--------------5--8--------\nG|--------5--7--------------\nD|-----5--7------------------\nA|--5--7----------------------\nE|--5--8------------------------</pre></div>" +
            "<p>Regra: 3x seguidas limpo → sobe 4 BPM. Errou 2x seguidas → desce 4 BPM. Depois de estável, treine a mesma caixa em <strong>grupos de 3 notas</strong> por corda para quebrar o padrão mecânico.</p>" },
        { id: "voc", title: "Vocabulário — riff estilo alternativo", dur: "15 min",
          body: "<p>Power chords usados no riff abaixo (dedo 1 na raiz, dedos 3+4 juntos duas casas acima):</p>" +
            "<div class='chord-grid'>" +
            "<div class='chord-card'><div class='name'>A5</div><pre>e|--\nB|--\nG|--\nD|-7-\nA|-7-\nE|-5-</pre></div>" +
            "<div class='chord-card'><div class='name'>C5</div><pre>e|--\nB|--\nG|-5-\nD|-5-\nA|-3-\nE|--</pre></div>" +
            "<div class='chord-card'><div class='name'>D5</div><pre>e|--\nB|--\nG|-7-\nD|-7-\nA|-5-\nE|--</pre></div>" +
            "<div class='chord-card'><div class='name'>E5</div><pre>e|--\nB|--\nG|-2-\nD|-2-\nA|-0-\nE|--</pre></div>" +
            "</div>" +
            "<p>Riff original (palm mute constante, cromatismo, síncope — 90 BPM):</p>" +
            "<div class='tab-readout'><pre>E|----------------------------------------------|\nA|--3--3--3--5--3--3--3--0--2--2--2--3--2--2--2-|\nD|--5--5--5--7--5--5--5--2--4--4--4--5--4--4--4-|\n    A5      C5  A5  E5      D5      (cromático)</pre></div>" +
            "<p>Toque primeiro sem síncope, batida reta, até travar no metrônomo. Só depois adiciona o empurrar do 3º tempo.</p>" },
        { id: "apl", title: "Aplicação musical", dur: "10 min",
          body: "<p>Procure um backing track <strong>\"rock backing track in A minor\"</strong> e improvise usando a caixa pentatônica treinada. Pelo menos 1 bend por frase, e toque com espaço — o objetivo é limpeza, não quantidade de notas.</p>" },
        { id: "rit", title: "Ritmo", dur: "5 min",
          body: "<p>Use o próprio riff do bloco de vocabulário como exercício rítmico: palm mute firme, metrônomo em 90–110 BPM, mão direita encostada perto do cavalete para o som ficar mais pesado.</p>" }
      ]
    },
    { key: "ter", label: "TER", weekday: 2, full: false, title: "Legato", focus: "Técnica: hammer-on / pull-off, fluidez com menos esforço de palhetada.",
      blocks: [
        { id: "aq", title: "Aquecimento", dur: "10 min", body: "<p>Mesmo cromático 1-2-3-4 do dia anterior, 60–70 BPM.</p>" },
        { id: "tec", title: "Legato — hammer-on / pull-off", dur: "20 min", bpm: true,
          body: "<p>Sequências de 3–4 notas por corda usando só a mão esquerda (hammer subindo, pull-off descendo), na mesma posição pentatônica de segunda. Mesma regra de BPM: 3x limpo sobe, 2 erros desce.</p>" },
        { id: "voc", title: "Vocabulário — licks legato", dur: "15 min", body: "<p>Peça no chat para detalhar licks de legato no estilo que você curte.</p>" },
        { id: "apl", title: "Aplicação musical", dur: "10 min", body: "<p>Backing track em A minor, tentando soar mais fluido, com menos ataques de palheta.</p>" },
        { id: "rit", title: "Ritmo", dur: "5 min", body: "<p>Power chords em palhetada firme, mesmo riff de segunda ou progressão nova.</p>" }
      ]
    },
    { key: "qua", label: "QUA", weekday: 3, full: false, title: "Bends & Vibrato", focus: "Técnica: controle de afinação em bends e vibrato expressivo.",
      blocks: [
        { id: "aq", title: "Aquecimento", dur: "10 min", body: "<p>Cromático 1-2-3-4, 60–70 BPM.</p>" },
        { id: "tec", title: "Bends + vibrato controlado", dur: "20 min", bpm: true, body: "<p>Bends de 1 tom comparando sempre com a nota alvo tocada solta. Vibrato controlado por pulso, não pelo dedo.</p>" },
        { id: "voc", title: "Vocabulário — frases com bend", dur: "15 min", body: "<p>Peça no chat para detalhar frases de bend no estilo que você curte.</p>" },
        { id: "apl", title: "Aplicação musical", dur: "10 min", body: "<p>Backing track, focando em expressividade — poucas notas, bem tocadas.</p>" },
        { id: "rit", title: "Ritmo", dur: "5 min", body: "<p>Power chords, mesmo padrão dos dias anteriores.</p>" }
      ]
    },
    { key: "qui", label: "QUI", weekday: 4, full: false, title: "String Skipping", focus: "Técnica: coordenação entre cordas não adjacentes.",
      blocks: [
        { id: "aq", title: "Aquecimento", dur: "10 min", body: "<p>Cromático 1-2-3-4, 60–70 BPM.</p>" },
        { id: "tec", title: "String skipping", dur: "20 min", bpm: true, body: "<p>Padrões pulando uma corda por vez dentro da pentatônica, mão direita com controle de silenciamento das cordas não tocadas.</p>" },
        { id: "voc", title: "Vocabulário — frases com salto", dur: "15 min", body: "<p>Peça no chat para detalhar licks de string skipping no estilo que você curte.</p>" },
        { id: "apl", title: "Aplicação musical", dur: "10 min", body: "<p>Backing track, aplicando os saltos de corda em frases curtas.</p>" },
        { id: "rit", title: "Ritmo", dur: "5 min", body: "<p>Power chords, mesmo padrão dos dias anteriores.</p>" }
      ]
    },
    { key: "sex", label: "SEX", weekday: 5, full: false, title: "Licks de Rock", focus: "Técnica livre — o que estiver mais difícil na semana.",
      blocks: [
        { id: "aq", title: "Aquecimento", dur: "10 min", body: "<p>Cromático 1-2-3-4, 60–70 BPM.</p>" },
        { id: "tec", title: "Técnica livre", dur: "20 min", bpm: true, body: "<p>Volte ao exercício da semana que ficou mais travado e treine só ele hoje.</p>" },
        { id: "voc", title: "Licks de rock combinados", dur: "15 min", body: "<p>Junte elementos dos outros dias (bend + legato + picking) numa frase só. Peça no chat para montar uma frase combinada.</p>" },
        { id: "apl", title: "Aplicação musical", dur: "10 min", body: "<p>Backing track, tentando soar musical com o que treinou na semana.</p>" },
        { id: "rit", title: "Ritmo", dur: "5 min", body: "<p>Revisão do riff da semana.</p>" }
      ]
    },
    { key: "sab", label: "SÁB", weekday: 6, full: false, title: "Jam & Gravação", focus: "Aplicar tudo sem pressão técnica, e ouvir o resultado.",
      blocks: [
        { id: "jam", title: "Jam session livre", dur: "40 min", body: "<p>Escolha 2–3 backing tracks de rock e improvise à vontade, sem se cobrar técnica — só música.</p>" },
        { id: "grv", title: "Gravação e escuta crítica", dur: "20 min", body: "<p>Grave um trecho de 2–3 minutos e ouça de volta. Anote 1 coisa boa e 1 coisa pra melhorar.</p>" }
      ]
    },
    { key: "dom", label: "DOM", weekday: 0, full: false, title: "Descanso", focus: "Recuperação — importante pro ganho de velocidade.",
      blocks: [
        { id: "rev", title: "Revisão leve (opcional)", dur: "15 min", body: "<p>Se quiser tocar, sem metrônomo, sem cobrança — só pelo prazer. Descanso também é treino.</p>" }
      ]
    }
  ];

  var STORAGE_KEY = "guitarTraining_v1";

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { logs: {}, bpmHistory: {} };
    } catch (e) {
      return { logs: {}, bpmHistory: {} };
    }
  }
  function saveData(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  var store = loadData();
  var today = new Date();
  var todayISO = isoDate(today);
  var todayWeekday = today.getDay();

  function isoDate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  var activeDayKey = (DAYS.filter(function (d) { return d.weekday === todayWeekday; })[0] || DAYS[0]).key;
  var openBlockIds = {};

  function logKeyFor(dayKey) { return todayISO + "_" + dayKey; }

  function getLog(dayKey) {
    var k = logKeyFor(dayKey);
    if (!store.logs[k]) store.logs[k] = { done: {}, bpm: null, notes: "" };
    return store.logs[k];
  }

  function computeStreak() {
    var streak = 0;
    var d = new Date(today);
    for (var i = 0; i < 365; i++) {
      var iso = isoDate(d);
      var hasActivity = Object.keys(store.logs).some(function (k) {
        if (k.indexOf(iso + "_") !== 0) return false;
        var entry = store.logs[k];
        return entry && Object.keys(entry.done || {}).some(function (id) { return entry.done[id]; });
      });
      if (hasActivity) { streak++; d.setDate(d.getDate() - 1); }
      else { if (i === 0) continue; break; }
    }
    return streak;
  }

  function renderTabs() {
    var nav = document.getElementById("dayTabs");
    nav.innerHTML = "";
    DAYS.forEach(function (day) {
      var el = document.createElement("div");
      var classes = ["day-tab"];
      if (day.key === activeDayKey) classes.push("active");
      if (day.weekday === todayWeekday) classes.push("today");
      el.className = classes.join(" ");
      var log = getLog(day.key);
      var totalBlocks = day.blocks.length;
      var doneBlocks = day.blocks.filter(function (b) { return log.done[b.id]; }).length;
      el.innerHTML = day.label + '<span class="dot ' + (doneBlocks === totalBlocks && totalBlocks > 0 ? "done" : "") + '"></span>';
      el.addEventListener("click", function () {
        activeDayKey = day.key;
        openBlockIds = {};
        render();
      });
      nav.appendChild(el);
    });
  }

  function renderHeaderStreak() {
    var streak = computeStreak();
    document.getElementById("streakNum").textContent = streak;
    document.getElementById("streakDot").className = "streak-dot" + (streak > 0 ? "" : " off");
  }

  function renderDay() {
    var day = DAYS.filter(function (d) { return d.key === activeDayKey; })[0];
    var log = getLog(day.key);
    var container = document.getElementById("dayContent");
    container.innerHTML = "";

    var header = document.createElement("div");
    header.className = "day-header";
    header.innerHTML =
      '<div class="kicker">' + (day.weekday === todayWeekday ? "HOJE" : "PLANO DA SEMANA") + '</div>' +
      "<h1>" + day.title + "</h1>" +
      "<p>" + day.focus + "</p>" +
      '<span class="tag-detail ' + (day.full ? "full" : "") + '">' + (day.full ? "detalhado" : "resumo — peça mais detalhe no chat") + "</span>";
    container.appendChild(header);

    var vu = document.createElement("div");
    vu.className = "vu-meter";
    day.blocks.forEach(function (b) {
      var seg = document.createElement("div");
      seg.className = "vu-seg" + (log.done[b.id] ? " on" : "");
      vu.appendChild(seg);
    });
    container.appendChild(vu);

    day.blocks.forEach(function (block) {
      var blockEl = document.createElement("div");
      blockEl.className = "block";

      var head = document.createElement("div");
      head.className = "block-head";

      var sw = document.createElement("div");
      sw.className = "switch" + (log.done[block.id] ? " on" : "");
      sw.innerHTML = '<div class="knob"></div>';
      sw.addEventListener("click", function (e) {
        e.stopPropagation();
        log.done[block.id] = !log.done[block.id];
        saveData(store);
        render();
      });

      var meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML =
        '<div class="title ' + (log.done[block.id] ? "done" : "") + '">' + block.title + "</div>" +
        '<div class="duration">' + block.dur + "</div>";

      var chev = document.createElement("div");
      chev.className = "chevron" + (openBlockIds[block.id] ? " open" : "");
      chev.textContent = "▸";

      head.appendChild(sw);
      head.appendChild(meta);
      head.appendChild(chev);
      head.addEventListener("click", function () {
        openBlockIds[block.id] = !openBlockIds[block.id];
        render();
      });

      var body = document.createElement("div");
      body.className = "block-body" + (openBlockIds[block.id] ? " open" : "");
      body.innerHTML = block.body;

      if (block.bpm) {
        var bpmWrap = document.createElement("div");
        bpmWrap.className = "bpm-box";
        var currentBpm = log.bpm || 70;
        bpmWrap.innerHTML =
          '<div class="label-row"><span>BPM DE HOJE</span><span>3x limpo = +4 · 2 erros = −4</span></div>' +
          '<div class="bpm-readout">' +
            '<div class="bpm-btn" data-delta="-4">−</div>' +
            '<div class="bpm-lcd"><div class="num">' + currentBpm + '</div><div class="unit">BPM</div></div>' +
            '<div class="bpm-btn" data-delta="4">+</div>' +
          '</div>';
        var hist = (store.bpmHistory[day.key] || []).slice(-10);
        if (hist.length > 1) {
          var maxBpm = Math.max.apply(null, hist.map(function (h) { return h.bpm; }).concat([1]));
          var histEl = document.createElement("div");
          histEl.className = "bpm-history";
          hist.forEach(function (h) {
            var bar = document.createElement("div");
            bar.className = "bar";
            bar.style.height = Math.max(6, (h.bpm / maxBpm) * 34) + "px";
            bar.title = h.date + " — " + h.bpm + " BPM";
            histEl.appendChild(bar);
          });
          bpmWrap.appendChild(histEl);
        } else {
          var emptyHist = document.createElement("div");
          emptyHist.className = "bpm-history-empty";
          emptyHist.textContent = "Histórico de BPM aparece aqui conforme você treina.";
          bpmWrap.appendChild(emptyHist);
        }
        body.appendChild(bpmWrap);

        bpmWrap.querySelectorAll(".bpm-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var delta = parseInt(btn.getAttribute("data-delta"), 10);
            var newBpm = Math.max(30, (log.bpm || 70) + delta);
            log.bpm = newBpm;
            if (!store.bpmHistory[day.key]) store.bpmHistory[day.key] = [];
            var lastEntry = store.bpmHistory[day.key][store.bpmHistory[day.key].length - 1];
            if (lastEntry && lastEntry.date === todayISO) {
              lastEntry.bpm = newBpm;
            } else {
              store.bpmHistory[day.key].push({ date: todayISO, bpm: newBpm });
            }
            saveData(store);
            render();
          });
        });
      }

      blockEl.appendChild(head);
      blockEl.appendChild(body);
      container.appendChild(blockEl);
    });

    var notesBlock = document.createElement("div");
    notesBlock.className = "notes-block";
    notesBlock.innerHTML =
      '<span class="notes-label">NOTAS DE HOJE</span>' +
      '<textarea class="notes" placeholder="Como foi o treino? O que travou, o que fluiu...">' + (log.notes || "") + "</textarea>";
    var textarea = notesBlock.querySelector("textarea");
    textarea.addEventListener("input", function () {
      log.notes = textarea.value;
      saveData(store);
    });
    container.appendChild(notesBlock);
  }

  function render() {
    renderTabs();
    renderHeaderStreak();
    renderDay();
  }

  render();
})();
</script>
</body>
</html>
